# A2: mounted Secret data / ConfigMap binaryData must be decoded bytes; non-UTF-8 env values warn
apiVersion: v1
kind: Secret
metadata:
  name: bugbin-secret
type: Opaque
data:
  keystore.p12: AP/+gAECww==
  greeting.txt: aGVsbG8tdGV4dA==
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bugbin-cm
data:
  plain.txt: "plain text"
binaryData:
  blob.bin: AP/+gAECww==
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugbin
spec:
  selector:
    matchLabels: {app: bugbin}
  template:
    metadata:
      labels: {app: bugbin}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          env:
            - name: KEYSTORE
              valueFrom:
                secretKeyRef: {name: bugbin-secret, key: keystore.p12}
            - name: GREETING
              valueFrom:
                secretKeyRef: {name: bugbin-secret, key: greeting.txt}
          envFrom:
            - secretRef: {name: bugbin-secret}
              prefix: FROM_
          volumeMounts:
            - {name: sec, mountPath: /etc/sec}
            - {name: cm, mountPath: /etc/cm}
      volumes:
        - name: sec
          secret: {secretName: bugbin-secret}
        - name: cm
          configMap: {name: bugbin-cm}
