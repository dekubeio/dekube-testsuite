# Keycloak provider — Keycloak CR (db + http + hostname) and a
# KeycloakRealmImport CR (realm/client auto-import). Bootstrap admin
# credentials are left unset on purpose, to exercise the auto-generation path.
apiVersion: v1
kind: Secret
metadata:
  name: extkc-db-creds
  namespace: default
type: Opaque
stringData:
  username: keycloak
  password: sup3rsecret
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: extkc-keycloak
  namespace: default
spec:
  instances: 1
  image: quay.io/keycloak/keycloak:25.0
  db:
    vendor: postgres
    host: extkc-postgresql
    port: 5432
    database: keycloak
    usernameSecret:
      name: extkc-db-creds
      key: username
    passwordSecret:
      name: extkc-db-creds
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: extkc.example.com
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: extkc-realm-import
  namespace: default
spec:
  keycloakCRName: extkc-keycloak
  realm:
    realm: extkc-realm
    enabled: true
    displayName: Ext Keycloak Realm
    clients:
      - clientId: extkc-app
        enabled: true
        publicClient: true
        redirectUris:
          - "https://extkc.example.com/*"
