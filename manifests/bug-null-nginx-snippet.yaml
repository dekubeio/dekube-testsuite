apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugnullsnippet
  annotations:
    nginx.ingress.kubernetes.io/configuration-snippet: null
spec:
  ingressClassName: nginx
  rules:
    - host: bugnullsnippet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugsel-svc
                port: {number: 80}
