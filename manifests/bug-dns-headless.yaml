# StatefulSet pod FQDNs through the governing headless Service
# (<sts>-<ordinal>.<serviceName>.<ns>.svc.cluster.local).
# - Default mode: bugdnshl-pg must carry network aliases for ordinal 0
#   (bugdnshl-pg-0.bugdnshl-pg-hl[.data[.svc[.cluster.local]]]) so the env
#   values below resolve without any rewrite. Compose runs one replica, so
#   ordinal 1 (PG_SHORT) gets no alias.
# - flatten-internal-urls: the whole pod FQDN collapses to the headless
#   service name alone (bugdnshl-pg-hl).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bugdnshl-pg
  namespace: data
spec:
  serviceName: bugdnshl-pg-hl
  replicas: 1
  selector:
    matchLabels: {app: bugdnshl-pg}
  template:
    metadata:
      labels: {app: bugdnshl-pg}
    spec:
      containers:
        - name: pg
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
# Governing headless Service of bugdnshl-pg.
apiVersion: v1
kind: Service
metadata:
  name: bugdnshl-pg-hl
  namespace: data
spec:
  clusterIP: None
  selector: {app: bugdnshl-pg}
  ports:
    - name: pg
      port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugdnshl
  namespace: data
spec:
  selector:
    matchLabels: {app: bugdnshl}
  template:
    metadata:
      labels: {app: bugdnshl}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          env:
            # Headless-service pod FQDN (StatefulSet ordinal + headless svc name).
            # flatten-internal-urls collapses the whole pod FQDN to the headless
            # service name alone (the ordinal prefix must not be left behind).
            - name: PG_URL
              value: postgres://bugdnshl-pg-0.bugdnshl-pg-hl.data.svc.cluster.local:5432/app
            - name: PG_SHORT
              value: bugdnshl-pg-1.bugdnshl-pg-hl.data.svc:5432
            # 4 labels before .svc (extra opaque prefix, not a real headless-pod
            # pattern) -> must be left alone by the fix. Before the fix this was
            # partially rewritten to "x.bugdnshl-pg-0.bugdnshl-pg-hl" (mangled,
            # not untouched) -- the fix's left-boundary check blocks it outright.
            - name: DEEP
              value: x.bugdnshl-pg-0.bugdnshl-pg-hl.data.svc.cluster.local
            # Plain Service form (no pod ordinal) -> must keep working after the fix.
            - name: SVC_URL
              value: http://bugdnshl-api.data.svc:8080
