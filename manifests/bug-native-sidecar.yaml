apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugsidecar
spec:
  selector:
    matchLabels: {app: bugsidecar}
  template:
    metadata:
      labels: {app: bugsidecar}
    spec:
      initContainers:
        - name: migrate
          image: busybox:1.36
          command: ["sh", "-c", "echo migrated"]
        - name: proxy
          image: busybox:1.36
          restartPolicy: Always
          command: ["sh", "-c", "sleep 3600"]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
