apiVersion: apps/v1
kind: Deployment
metadata:
  name: buglongsidecar-a-deliberately-long-deployment-name
spec:
  selector:
    matchLabels: {app: buglongsidecar}
  template:
    metadata:
      labels: {app: buglongsidecar}
    spec:
      initContainers:
        - name: proxy-with-long-name
          image: busybox:1.36
          restartPolicy: Always
          command: ["sh", "-c", "sleep 3600"]
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
