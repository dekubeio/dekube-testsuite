# An explicit ingressClassName is authoritative: stray nginx/traefik
# annotations (chart defaults) must not pull the Ingress away from haproxy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugclsauth-ing
  annotations:
    haproxy.org/server-ssl: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: haproxy
  rules:
    - host: bugclsauth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugclsauth-svc
                port: {number: 443}
---
# A custom class unknown to dekube (not in ingress_types) still falls back
# to the annotation heuristic: nginx annotations → nginx rewriter.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugclsauth-custom
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 24m
spec:
  ingressClassName: nginx-internal
  rules:
    - host: bugclsauth-custom.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugclsauth-svc
                port: {number: 80}
