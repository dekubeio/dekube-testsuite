apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: bugissuerkind-shared
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: bugissuerkind-shared
  namespace: bugissuerkind-ns
spec:
  ca:
    secretName: bugissuerkind-never-generated
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bugissuerkind-cert
spec:
  secretName: bugissuerkind-cert-tls
  dnsNames: [bugissuerkind.example.com]
  issuerRef:
    name: bugissuerkind-shared
    kind: ClusterIssuer
