# trust-manager Bundle regressions:
#  1. a null item in spec.sources (Helm conditional) used to crash _collect_source.
#  2. spec.target.secret was silently ignored — only target.configMap was honored.
# This Bundle sets target.secret (no configMap) so a fixed converter must inject a
# Secret; a workload volume-mounts it so the mount machinery writes it to disk.
apiVersion: v1
kind: Secret
metadata:
  name: bugtrgtsec-src
  namespace: default
type: Opaque
data:
  # base64("-----BEGIN CERTIFICATE-----\nfake-ca-for-test\n-----END CERTIFICATE-----\n")
  ca.crt: LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCmZha2UtY2EtZm9yLXRlc3QKLS0tLS1FTkQgQ0VSVElGSUNBVEUtLS0tLQo=
---
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: bugtrgtsec-bundle
spec:
  sources:
    - null  # Helm conditional producing an empty list item
    - secret:
        name: bugtrgtsec-src
        key: ca.crt
  target:
    secret:
      key: ca-bundle.crt
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugtrgtsec-app
  namespace: default
  labels:
    app: bugtrgtsec-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugtrgtsec-app
  template:
    metadata:
      labels:
        app: bugtrgtsec-app
    spec:
      containers:
        - name: app
          image: bugtrgtsec-app:1.0
          volumeMounts:
            - name: ca-bundle
              mountPath: /etc/ssl/trust
      volumes:
        - name: ca-bundle
          secret:
            secretName: bugtrgtsec-bundle
