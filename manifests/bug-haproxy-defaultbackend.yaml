# Hostless rule and spec.defaultBackend: catch-all routing that the entry
# format cannot express — must warn instead of being dropped silently.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bughapdb-ing
  annotations:
    kubernetes.io/ingress.class: haproxy
spec:
  defaultBackend:
    service:
      name: bughapdb-default
      port: {number: 80}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bughapdb-svc
                port: {number: 80}
    - host: bughapdb.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bughapdb-svc
                port: {number: 80}
