# Caddy server-ca regression: the CA Secret referenced by haproxy.org/server-ca is
# only ever referenced by annotation (no pod volume-mounts it), so nothing wrote it
# to output_dir/secrets/<name>/ — Caddy's tls_trust_pool pointed at a file that never
# existed on disk. Real self-signed CA cert below so Caddy actually loads it at startup.
apiVersion: v1
kind: Secret
metadata:
  name: bugcdsca-backend-ca
  namespace: default
type: Opaque
data:
  ca.crt: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugcdsca-backend
  namespace: default
  labels:
    app: bugcdsca-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bugcdsca-backend
  template:
    metadata:
      labels:
        app: bugcdsca-backend
    spec:
      containers:
        - name: backend
          image: nginx:alpine
          ports:
            - containerPort: 443
              name: https
---
apiVersion: v1
kind: Service
metadata:
  name: bugcdsca-backend
  namespace: default
spec:
  selector:
    app: bugcdsca-backend
  ports:
    - port: 443
      targetPort: 443
      name: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugcdsca-ingress
  namespace: default
  annotations:
    haproxy.org/server-ssl: "true"
    haproxy.org/server-ca: "default/bugcdsca-backend-ca"
spec:
  rules:
    - host: bugcdsca.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugcdsca-backend
                port: {number: 443}
