# Helm-rendered explicit `path: null` must not crash the nginx rewriter
# (rewrite-target) or the traefik rewriter (resolved StripPrefix).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugnullpath-nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: bugnullpath-nginx.example.com
      http:
        paths:
          - path: null
            pathType: ImplementationSpecific
            backend:
              service:
                name: bugnullpath-svc
                port: {number: 80}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: bugnullpath-strip
  namespace: bugnullpath
spec:
  stripPrefix:
    prefixes:
      - /bugnullpath
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugnullpath-traefik
  namespace: bugnullpath
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: bugnullpath-bugnullpath-strip@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: bugnullpath-traefik.example.com
      http:
        paths:
          - path: null
            pathType: ImplementationSpecific
            backend:
              service:
                name: bugnullpath-svc
                port: {number: 80}
