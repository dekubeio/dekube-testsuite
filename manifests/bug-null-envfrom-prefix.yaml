# envFrom with an explicitly null prefix: env names must be the bare keys (KEY),
# not the stringified None ("NoneKEY").
apiVersion: v1
kind: ConfigMap
metadata:
  name: bugnullpfx-cm
  namespace: bugnullpfx
data:
  BUGNULLPFX_KEY: value
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugnullpfx-app
  namespace: bugnullpfx
spec:
  selector:
    matchLabels: {app: bugnullpfx-app}
  template:
    metadata:
      labels: {app: bugnullpfx-app}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "infinity"]
          envFrom:
            - prefix: null
              configMapRef:
                name: bugnullpfx-cm
